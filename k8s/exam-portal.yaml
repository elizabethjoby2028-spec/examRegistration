apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-exam-portal
  labels:
    app: college-exam-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: college-exam-portal
  template:
    metadata:
      labels:
        app: college-exam-portal
    spec:
      containers:
      - name: exam-portal
        image: elizabethjoby101/college-exam-portal:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          limits:
            cpu: "250m"
            memory: "128Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: college-exam-portal-service
  labels:
    app: college-exam-portal
spec:
  type: NodePort
  selector:
    app: college-exam-portal
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30085
